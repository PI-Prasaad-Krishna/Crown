[package]
name = "crown-browser"
version = "1.0.0"
description = "Crown — Ultra-lightweight, customizable browser with Brave-inspired Shields for Desktop and Android"
edition = "2021"

[lib]
name = "crown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
