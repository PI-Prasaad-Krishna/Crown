[package]
name = "crown-browser"
version = "1.0.0"
description = "Crown — Ultra-lightweight, customizable browser with Brave-inspired Shields for Desktop and Android"
edition = "2021"

[lib]
name = "crown_lib"
crate-type = ["rlib"]
test = false

[[bin]]
name = "crown-browser"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zeroize = "1.9"
hex = "0.4"
ring = "0.17"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
